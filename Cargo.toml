[package]
# Port of Better Advanced Tooltips 2101.1.0-build.5 (latvian.dev/better-advanced-tooltips,
# MIT) to Horizon 26.3 at the campaign pin. Clean-room Rust rewrite from the mod's
# observable behaviour (see notes.md and FINDINGS.md); published under MIT with this source.
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "betteradvancedtooltips"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Better Advanced Tooltips for Horizon: fuel and data-component lines on item tooltips in advanced (F3+H) mode"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build). R9 refuses
# every other dependency and every other table.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
